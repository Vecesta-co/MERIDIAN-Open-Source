# MERIDIAN Infrastructure — Docker Compose (Placeholder)
# Phase 0: Foundation & Data Contracts
# Full multi-service setup will be added in Phase 9 (Hardening)

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: meridian-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - meridian_pgdata:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI) — will be configured in later phases
  # api:
  #   build:
  #     context: ../backend
  #     dockerfile: Dockerfile
  #   container_name: meridian-api
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/meridian
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  meridian_pgdata:
