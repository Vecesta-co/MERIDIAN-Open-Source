[mypy]
# MERIDIAN backend type-check configuration.
# - ignore_missing_imports: third-party libs without type stubs
#   (litellm, psycopg2, PyYAML) are optional/runtime-imported; their
#   absence of stubs must not fail the check.
# - check_untyped_defs: still type-check bodies of unannotated functions.
ignore_missing_imports = True
check_untyped_defs = True

# Test-only modules are included when running `mypy .` from the backend root.
[mypy-tests.*]
ignore_missing_imports = True
